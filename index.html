<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Kristen's Power Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Quicksand:wght@500;600;700&family=Shrikhand&family=VT323&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
/* Layout: Memphis-pattern pastel ground; chunky outlined "sticker" panels with hard offset shadows.
   Money strip on top, deal pipeline, then the to-do world. One deliberate light look. */
:root {
  color-scheme: light;
  --bg: #f9d7f0;        /* cotton candy */
  --lav: #cdbaff;       /* lavender */
  --sky: #a9e3ff;       /* baby blue */
  --pink: #ffa6d8;      /* bubblegum */
  --hot: #ff4fb0;       /* hot pink pop */
  --lemon: #fff1a1;
  --mint: #b6f3d6;
  --orchid: #e6b3ff;
  --card: #fffaff;
  --ink: #3d1f63;       /* grape outline + text */
  --ink-soft: #6d5596;
  --display: "Shrikhand", "Cooper Black", Georgia, serif;
  --label: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Quicksand", "Avenir Next", system-ui, sans-serif;
  --digits: "VT323", "Courier New", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-weight: 600;
  font-size: 15px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 60px;
}
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 28px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px dashed var(--hot); outline-offset: 2px; }

/* ---------- Header ---------- */
header.top {
  display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px;
}
h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(2.4rem, 7vw, 4.6rem);
  line-height: .95;
  margin: 0;
  color: var(--hot);
  text-shadow: 3px 3px 0 var(--sky), 6px 6px 0 var(--lav), 9px 9px 0 var(--ink);
  -webkit-text-stroke: 1.5px var(--ink);
  transform: rotate(-2deg);
  text-wrap: balance;
}
.tagline {
  font-family: var(--label); font-size: .78rem; letter-spacing: .08em;
  background: var(--lemon); border: 3px solid var(--ink); border-radius: 999px;
  padding: 4px 14px; display: inline-block; margin-top: 18px; box-shadow: 3px 3px 0 var(--ink);
}
.clock {
  font-family: var(--digits); font-size: 1.9rem; line-height: 1;
  background: var(--ink); color: var(--mint);
  border-radius: 12px; padding: 8px 16px; box-shadow: 4px 4px 0 var(--hot);
  letter-spacing: .04em;
}
.status { font-size: .85rem; color: var(--ink-soft); }
.status.warn { color: #b0105f; }

/* ---------- Panels ---------- */
.panel {
  background: var(--card);
  border: 3px solid var(--ink);
  border-radius: 22px;
  box-shadow: 7px 7px 0 var(--ink);
  padding: 18px;
  min-width: 0;
}
.section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
h2 {
  font-family: var(--label); font-weight: 400; margin: 0;
  font-size: clamp(1.2rem, 3vw, 1.6rem); letter-spacing: .02em;
  color: var(--ink);
  text-shadow: 2px 2px 0 var(--pink);
}
h3 { font-family: var(--label); font-weight: 400; margin: 0; font-size: .88rem; letter-spacing: .05em; }
.kicker { font-family: var(--label); font-size: .7rem; letter-spacing: .12em; color: var(--ink-soft); }
.empty { color: var(--ink-soft); font-size: .88rem; font-style: italic; padding: 8px 4px; }

/* ---------- Buttons & inputs ---------- */
.btn {
  font-family: var(--label); font-size: .8rem; letter-spacing: .05em;
  background: var(--hot); color: #fff; border: 3px solid var(--ink); border-radius: 14px;
  padding: 9px 16px; box-shadow: 4px 4px 0 var(--ink); transition: transform .08s, box-shadow .08s;
  white-space: nowrap;
}
.btn:hover { transform: translate(-1px,-1px); box-shadow: 5px 5px 0 var(--ink); }
.btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.alt { background: var(--sky); color: var(--ink); }
.btn.soft { background: var(--card); color: var(--ink); }
.btn.small { font-size: .68rem; padding: 6px 10px; border-width: 2px; box-shadow: 3px 3px 0 var(--ink); border-radius: 10px; }
.field {
  background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 9px 12px;
  min-width: 0; width: 100%;
}
.field::placeholder { color: #a493c2; }
select.field { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 12px) 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 32px; }
label.lbl { display: grid; gap: 4px; font-size: .74rem; font-family: var(--label); letter-spacing: .06em; min-width: 0; }
.icon-btn {
  border: 2px solid var(--ink); background: #fff; border-radius: 10px; width: 32px; height: 32px;
  display: inline-grid; place-items: center; font-size: 1rem; line-height: 1; flex: none;
  box-shadow: 2px 2px 0 var(--ink);
}
.icon-btn:hover { background: var(--lemon); }
.icon-btn.on { background: var(--lemon); }
.icon-btn.danger:hover { background: var(--pink); }
.icon-btn.confirm { width: auto; padding: 0 8px; font-family: var(--label); font-size: .62rem; background: var(--hot); color: #fff; }

/* ---------- Money strip ---------- */
.money { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.tile {
  border: 3px solid var(--ink); border-radius: 18px; padding: 12px 14px; box-shadow: 5px 5px 0 var(--ink);
  display: grid; gap: 2px; min-width: 0; position: relative; overflow: hidden;
}
.tile .kicker { color: var(--ink); }
.tile .amt { font-family: var(--digits); font-size: 2.3rem; line-height: 1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .cnt { font-size: .8rem; }
.tile.total { background: var(--ink); color: #fff; box-shadow: 5px 5px 0 var(--hot); }
.tile.total .kicker { color: var(--lemon); }
.tile.total .amt { color: var(--mint); font-size: 2.8rem; }
.tile.cut { background: repeating-linear-gradient(-45deg, var(--hot) 0 14px, #ff6cbe 14px 28px); color: #fff; }
.tile.cut .kicker { color: #fff; }
.tile.cut .amt { font-size: 2.8rem; text-shadow: 2px 2px 0 var(--ink); }

/* ---------- Deals ---------- */
.deal-form { display: grid; grid-template-columns: 2fr 1fr 1.4fr 2fr auto; gap: 10px; align-items: end; margin-bottom: 18px; }
@media (max-width: 900px) { .deal-form { grid-template-columns: 1fr 1fr; } .deal-form .wide { grid-column: 1 / -1; } }
.pipe-scroll { overflow-x: auto; padding: 4px 8px 12px 2px; margin-inline: -2px; }
.pipeline { display: grid; grid-template-columns: repeat(5, minmax(210px, 1fr)); gap: 14px; }
.col {
  border: 3px solid var(--ink); border-radius: 18px; padding: 10px; min-height: 220px;
  display: flex; flex-direction: column; gap: 10px; transition: transform .12s, box-shadow .12s;
  background-image: radial-gradient(rgba(61,31,99,.13) 1.4px, transparent 1.6px); background-size: 14px 14px;
}
.col.over { transform: scale(1.02); box-shadow: 0 0 0 4px var(--hot), 6px 6px 0 var(--ink); }
.col-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; background: var(--card); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px; }
.col-head .sum { font-family: var(--digits); font-size: 1.3rem; line-height: 1; }
.col-cards { display: flex; flex-direction: column; gap: 10px; flex: 1; }
.deal {
  background: var(--card); border: 3px solid var(--ink); border-radius: 14px; padding: 10px 10px 8px;
  box-shadow: 4px 4px 0 var(--ink); user-select: none; -webkit-user-select: none; cursor: grab;
  display: grid; gap: 4px; min-width: 0;
}
.deal.dragging { opacity: .35; }
.deal .name { font-weight: 700; font-size: 1rem; overflow-wrap: anywhere; }
.deal .val { font-family: var(--digits); font-size: 1.55rem; line-height: 1; color: var(--hot); }
.deal .notes { font-size: .8rem; color: var(--ink-soft); overflow-wrap: anywhere; white-space: pre-wrap; }
.deal .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; margin-top: 4px; }
.deal .row .grp { display: flex; gap: 6px; }
.icon-btn.danger { font-size: .9rem; }
.grip { touch-action: none; cursor: grab; font-size: 1.05rem; letter-spacing: -2px; }
.ghost { position: fixed; left: 0; top: 0; z-index: 500; pointer-events: none; box-shadow: 10px 12px 0 rgba(61,31,99,.45); }
.sample-tag { font-family: var(--label); font-size: .55rem; letter-spacing: .08em; background: var(--lemon); border: 2px solid var(--ink); border-radius: 6px; padding: 1px 5px; justify-self: start; }

/* ---------- Productivity ---------- */
.add-task { display: grid; grid-template-columns: 2.4fr 1.4fr auto auto; gap: 10px; align-items: end; }
@media (max-width: 820px) { .add-task { grid-template-columns: 1fr; } }
.chk-pick { display: flex; gap: 8px; align-items: center; font-size: .82rem; padding-bottom: 10px; white-space: nowrap; }
.chk-pick input { width: 20px; height: 20px; accent-color: var(--hot); }

.focus {
  background: var(--ink); color: #fff; box-shadow: 7px 7px 0 var(--hot);
  background-image: radial-gradient(rgba(255,255,255,.08) 1.5px, transparent 1.7px); background-size: 16px 16px;
}
.focus h2 { color: var(--lemon); text-shadow: 2px 2px 0 var(--hot); }
.focus .kicker { color: var(--sky); }
.meter { height: 22px; border: 3px solid #fff; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.12); flex: 1; min-width: 140px; }
.meter > div { height: 100%; width: 0; background: repeating-linear-gradient(-45deg, var(--pink) 0 10px, var(--sky) 10px 20px, var(--lav) 20px 30px); transition: width .4s; }
.meter-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.meter-label { font-family: var(--digits); font-size: 1.6rem; line-height: 1; color: var(--mint); }
.focus .empty { color: #d9cdf2; }
.focus .task { background: rgba(255,255,255,.96); color: var(--ink); }

.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; align-items: start; }
.list-panel { padding: 0; overflow: hidden; }
.list-panel .lp-head { padding: 12px 16px; border-bottom: 3px solid var(--ink); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.list-panel .lp-body { padding: 12px; display: grid; gap: 8px; }
.count-pill { font-family: var(--digits); font-size: 1.25rem; line-height: 1; background: var(--card); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 10px; }
.task {
  display: flex; align-items: flex-start; gap: 8px; background: #fff; border: 2px solid var(--ink);
  border-radius: 12px; padding: 7px 8px; min-width: 0;
}
.task .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; padding-top: 4px; }
.task .where { display: block; font-family: var(--label); font-size: .56rem; letter-spacing: .08em; color: var(--ink-soft); margin-top: 2px; }
.task.done .txt { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--hot); opacity: .7; }
.tick {
  appearance: none; -webkit-appearance: none; flex: none; width: 26px; height: 26px; margin: 2px 0 0;
  border: 3px solid var(--ink); border-radius: 8px; background: #fff; cursor: pointer; display: grid; place-items: center;
}
.tick:hover { background: var(--mint); }
.tick:checked { background: var(--hot); }
.tick:checked::after { content: "✓"; color: #fff; font-weight: 700; font-size: .95rem; line-height: 1; }

.event-block { border: 2px dashed var(--ink); border-radius: 14px; padding: 10px; display: grid; gap: 8px; background: rgba(205,186,255,.18); }
.event-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.event-head h3 { font-size: .95rem; color: var(--hot); text-shadow: 1px 1px 0 var(--ink); overflow-wrap: anywhere; min-width: 0; }
.event-add { display: flex; gap: 8px; }
.event-add .field { padding: 7px 10px; }

.done-list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.done-list .task { background: var(--mint); }
.done-when { font-family: var(--digits); font-size: 1.05rem; color: var(--ink-soft); white-space: nowrap; padding-top: 3px; }

/* ---------- Overlays ---------- */
.toast {
  position: fixed; left: 50%; top: 40%; z-index: 9500; pointer-events: none;
  font-family: var(--display); font-size: clamp(2rem, 7vw, 4rem); color: var(--hot); white-space: nowrap;
  -webkit-text-stroke: 2px var(--ink); text-shadow: 4px 4px 0 var(--sky), 8px 8px 0 var(--ink);
  transform: translate(-50%, -50%) scale(.2) rotate(-8deg); opacity: 0;
}
.toast.show { animation: pop 1.9s cubic-bezier(.2,1.6,.4,1) forwards; }
.toast.big { white-space: normal; text-align: center; width: min(92vw, 900px); font-size: clamp(2.4rem, 9vw, 6rem); line-height: 1; }
.toast.big.show { animation: pop 4.8s cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(.2) rotate(-8deg); }
  14% { opacity: 1; transform: translate(-50%,-50%) scale(1.08) rotate(-4deg); }
  22% { transform: translate(-50%,-50%) scale(1) rotate(-3deg); }
  82% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(-3deg); }
  100% { opacity: 0; transform: translate(-50%,-60%) scale(.9) rotate(-3deg); }
}
.blackout { position: fixed; inset: 0; z-index: 9000; background: #000; display: grid; place-items: center; }
.blackout span { font-family: var(--digits); color: #2a2a2a; font-size: 1.4rem; letter-spacing: .3em; }
.msg { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 9600; background: var(--ink); color: #fff; border-radius: 12px; padding: 10px 16px; box-shadow: 4px 4px 0 var(--hot); max-width: calc(100vw - 32px); font-size: .9rem; }

.modal-bg { position: fixed; inset: 0; z-index: 800; background: rgba(61,31,99,.45); display: grid; place-items: center; padding: 16px; }
.modal { width: min(460px, 100%); display: grid; gap: 12px; }
.modal .actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
textarea.field { resize: vertical; min-height: 70px; }

.err { background: var(--pink); border: 2px solid var(--ink); border-radius: 12px; padding: 8px 12px; font-size: .88rem; }
@media (prefers-reduced-motion: reduce) { .btn, .col, .meter > div { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Kristen's Power Board</h1>
      <div class="tagline">DEALS · DREAMS · DONE</div>
    </div>
    <div style="display:grid;gap:8px;justify-items:end">
      <div class="clock" id="clock">--</div>
      <div class="status" id="status">Loading your board…</div>
    </div>
  </header>

  <!-- TODAY -->
  <section class="panel focus" aria-labelledby="focus-h">
    <div class="section-head"><h2 id="focus-h">Today's Mission Critical Tasks</h2><span class="kicker" id="focusDate"></span></div>
    <div class="meter-row"><div class="meter" aria-hidden="true"><div id="meterFill"></div></div><span class="meter-label" id="meterLabel">0 / 0</span></div>
    <div id="focusList" style="display:grid;gap:8px"></div>
  </section>

  <!-- MONEY -->
  <section class="panel" aria-labelledby="money-h" style="background:var(--sky)">
    <div class="section-head"><h2 id="money-h">Money Tracker</h2><span class="kicker">ALL OPEN DEALS BY STAGE</span></div>
    <div class="money" id="money"></div>
  </section>

  <!-- DEALS -->
  <section class="panel" id="deals" aria-labelledby="deals-h">
    <div class="section-head"><h2 id="deals-h">Deal Board</h2><span class="kicker">DRAG CARDS TO MOVE THEM ALONG</span></div>
    <form class="deal-form" id="dealForm" autocomplete="off">
      <label class="lbl wide">CLIENT / OWNER NAME<input class="field" id="dealName" required maxlength="120" placeholder="Who booked with you?"></label>
      <label class="lbl">DEAL VALUE ($)<input class="field" id="dealAmt" inputmode="decimal" placeholder="2,400"></label>
      <label class="lbl">STARTS IN<select class="field" id="dealStage"></select></label>
      <label class="lbl wide">NOTES<input class="field" id="dealNotes" maxlength="300" placeholder="Doors, units, consult date…"></label>
      <button class="btn wide" type="submit">+ Add Deal</button>
    </form>
    <div class="pipe-scroll"><div class="pipeline" id="pipeline"></div></div>
  </section>

  <!-- ADD TASK -->
  <section class="panel" id="todo" aria-labelledby="add-h" style="background:var(--lav)">
    <div class="section-head"><h2 id="add-h">Add a Task</h2><span class="kicker">PICK WHERE IT BELONGS</span></div>
    <form class="add-task" id="taskForm" autocomplete="off">
      <label class="lbl">WHAT'S THE TASK?<input class="field" id="taskText" required maxlength="200" placeholder="Call the HOA about the pool key…"></label>
      <label class="lbl">WHERE DOES IT GO?<select class="field" id="taskList"></select></label>
      <label class="chk-pick"><input type="checkbox" id="taskFocus"> Mission critical today</label>
      <button class="btn" type="submit">+ Add</button>
    </form>
  </section>

  <!-- LISTS -->
  <div class="lists" id="lists"></div>

  <!-- DONE -->
  <section class="panel" aria-labelledby="done-h" style="background:var(--mint)">
    <div class="section-head"><h2 id="done-h">Done &amp; Dusted</h2><button class="btn small soft" id="clearDone" type="button">Clear done list</button></div>
    <div class="done-list" id="doneList"></div>
  </section>
</div>

<div class="toast" id="toast"></div>
<div class="blackout" id="blackout" hidden><span>· · ·</span></div>
<div class="msg" id="msg" hidden></div>
<div class="modal-bg" id="modalBg" hidden>
  <form class="panel modal" id="editForm" autocomplete="off">
    <h2>Edit Deal</h2>
    <label class="lbl">CLIENT / OWNER NAME<input class="field" id="editName" required maxlength="120"></label>
    <label class="lbl">DEAL VALUE ($)<input class="field" id="editAmt" inputmode="decimal"></label>
    <label class="lbl">STAGE<select class="field" id="editStage"></select></label>
    <label class="lbl">NOTES<textarea class="field" id="editNotes" maxlength="300"></textarea></label>
    <div class="actions"><button class="btn soft" type="button" id="editCancel">Cancel</button><button class="btn" type="submit">Save</button></div>
  </form>
</div>

<script>
(function () {
  "use strict";

  // ---------- Board setup ----------
  const STAGES = [
    { id: "consult", name: "Consultation Booked", color: "var(--lav)" },
    { id: "prep",    name: "Prepare Agreement",   color: "var(--sky)" },
    { id: "sent",    name: "Agreement Sent",      color: "var(--pink)" },
    { id: "signed",  name: "Agreement Signed",    color: "var(--lemon)" },
    { id: "onboard", name: "Onboarding",          color: "var(--mint)" }
  ];
  const LISTS = [
    { id: "home",   name: "Home / Life",             color: "var(--pink)" },
    { id: "work",   name: "Work To-Do's",            color: "var(--sky)" },
    { id: "ideas",  name: "Marketing Ideas Board",   color: "var(--lemon)" },
    { id: "init",   name: "Marketing Initiatives",   color: "var(--mint)" },
    { id: "elevate", name: "Elevate",                color: "var(--orchid)" },
    { id: "events", name: "Upcoming Event Planning", color: "var(--lav)" }
  ];
  const PARTY = ["#ff4fb0", "#ffa6d8", "#cdbaff", "#a9e3ff", "#fff1a1", "#b6f3d6", "#9b5cff", "#2ec5ff"];

  const S = { deals: [], tasks: [], events: [], loaded: { deals: false, tasks: false, events: false }, db: null, armDelete: null };
  const $ = (id) => document.getElementById(id);
  const money = (n) => new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(n || 0);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const todayKey = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const parseAmt = (v) => { const n = parseFloat(String(v || "").replace(/[^0-9.]/g, "")); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
  const byCreated = (a, b) => String(a.created || "").localeCompare(String(b.created || ""));

  // ---------- Memphis background (drawn once) ----------
  function memphis() {
    const T = 560, c = document.createElement("canvas"); c.width = c.height = T * 2;
    const g = c.getContext("2d"); g.scale(2, 2);
    let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const cols = ["#ff7fc6", "#b79cff", "#7fd3ff", "#ffe56b", "#8ee8bd", "#c58cff"];
    g.fillStyle = "#f9d7f0"; g.fillRect(0, 0, T, T);
    const shapes = [];
    for (let i = 0; i < 46; i++) shapes.push({ k: Math.floor(r() * 6), x: r() * T, y: r() * T, a: r() * Math.PI * 2, c: cols[Math.floor(r() * cols.length)], s: 0.7 + r() * 0.6 });
    const draw = (sh, ox, oy) => {
      g.save(); g.translate(sh.x + ox, sh.y + oy); g.rotate(sh.a); g.scale(sh.s, sh.s);
      g.lineCap = "round"; g.lineJoin = "round"; g.globalAlpha = .7;
      const stroke = (fn) => { g.strokeStyle = "rgba(61,31,99,.25)"; g.lineWidth = 6; g.save(); g.translate(2, 3); fn(); g.stroke(); g.restore(); g.strokeStyle = sh.c; g.lineWidth = 5; fn(); g.stroke(); };
      if (sh.k === 0) stroke(() => { g.beginPath(); g.moveTo(-36, 0); for (let i = 0; i < 6; i++) g.lineTo(-24 + i * 12, i % 2 ? 10 : -10); });
      else if (sh.k === 1) stroke(() => { g.beginPath(); for (let t = 0; t <= Math.PI * 6; t += .15) { const x = t * 4 - 38 + 12 * Math.cos(t + Math.PI), y = 12 * Math.sin(t); t === 0 ? g.moveTo(x, y) : g.lineTo(x, y); } });
      else {
        g.fillStyle = sh.c; g.strokeStyle = "rgba(61,31,99,.55)"; g.lineWidth = 2; g.beginPath();
        if (sh.k === 2) { g.moveTo(0, -18); g.lineTo(18, 14); g.lineTo(-18, 14); g.closePath(); }
        else if (sh.k === 3) g.arc(0, 0, 13, 0, Math.PI * 2);
        else if (sh.k === 4) g.rect(-12, -12, 24, 24);
        else { g.globalAlpha = .5; for (let i = 0; i < 5; i++) for (let j = 0; j < 4; j++) { g.moveTo(-20 + i * 9 + 2, -14 + j * 9); g.arc(-20 + i * 9, -14 + j * 9, 2, 0, Math.PI * 2); } g.fill(); g.restore(); return; }
        g.fill(); g.stroke();
      }
      g.restore();
    };
    for (const sh of shapes) for (const ox of [-T, 0, T]) for (const oy of [-T, 0, T]) draw(sh, ox, oy);
    try { document.body.style.backgroundImage = "url(" + c.toDataURL("image/png") + ")"; document.body.style.backgroundSize = T + "px " + T + "px"; } catch (e) {}
  }

  // ---------- Saving ----------
  function flash(text) {
    const m = $("msg"); m.textContent = text; m.hidden = false;
    clearTimeout(flash.t); flash.t = setTimeout(() => { m.hidden = true; }, 4000);
  }
  const saveFail = () => flash("That change didn't save. Check your internet connection and try again.");
  // When Claude's saving isn't available (e.g. the GitHub copy), keep everything in this browser.
  const LOCAL_KEY = "kristens-power-board-v1";
  let localOK = false;
  function loadLocal() {
    try {
      const raw = localStorage.getItem(LOCAL_KEY); localOK = true;
      if (raw) { const d = JSON.parse(raw); for (const k of ["deals", "tasks", "events"]) S[k] = Array.isArray(d[k]) ? d[k] : []; }
    } catch (e) { localOK = false; }
  }
  function saveLocal() {
    if (!localOK) return;
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ deals: S.deals, tasks: S.tasks, events: S.events })); } catch (e) { saveFail(); }
  }
  const store = {
    async add(col, data) {
      if (S.db) return S.db.collection(col).add(data).catch(saveFail);
      S[col].push(Object.assign({ id: "m" + Date.now() + Math.random().toString(36).slice(2) }, data)); saveLocal(); render();
    },
    async update(col, id, data) {
      if (S.db) return S.db.doc(col + "/" + id).update(data).catch(saveFail);
      const it = S[col].find((x) => x.id === id); if (it) Object.assign(it, data); saveLocal(); render();
    },
    async remove(col, id) {
      if (S.db) return S.db.doc(col + "/" + id).delete().catch(saveFail);
      S[col] = S[col].filter((x) => x.id !== id); saveLocal(); render();
    }
  };

  // ---------- Celebrations ----------
  function fire(opts) { if (typeof confetti === "function") confetti(Object.assign({ colors: PARTY, zIndex: 9400, shapes: ["square", "circle", "star"] }, opts)); }
  function showToast(text, big) {
    const t = $("toast"); t.textContent = text; t.className = "toast" + (big ? " big" : "");
    void t.offsetWidth; t.className = "toast show" + (big ? " big" : "");
  }
  function smallParty(fromEl, text) {
    let x = .5, y = .5;
    if (fromEl) { const b = fromEl.getBoundingClientRect(); x = (b.left + b.width / 2) / innerWidth; y = (b.top + b.height / 2) / innerHeight; }
    fire({ particleCount: 140, spread: 90, startVelocity: 42, origin: { x, y } });
    setTimeout(() => fire({ particleCount: 80, spread: 140, startVelocity: 30, origin: { x: .5, y: .45 } }), 180);
    showToast(text || "Way to go Kristen!");
  }
  function megaParty() {
    const b = $("blackout"); b.hidden = false;
    setTimeout(() => {
      b.hidden = true;
      showToast("MISSION COMPLETE! WAY TO GO KRISTEN!", true);
      fire({ particleCount: 300, spread: 160, startVelocity: 60, origin: { x: .5, y: .6 } });
      const end = Date.now() + 6500;
      (function rain() {
        fire({ particleCount: 14, angle: 60, spread: 70, startVelocity: 65, origin: { x: 0, y: .7 } });
        fire({ particleCount: 14, angle: 120, spread: 70, startVelocity: 65, origin: { x: 1, y: .7 } });
        fire({ particleCount: 26, spread: 200, startVelocity: 12, gravity: .7, ticks: 420, scalar: 1.2, origin: { x: Math.random(), y: -0.1 } });
        if (Date.now() < end) setTimeout(rain, 70);
      })();
    }, 2000);
  }

  // ---------- Actions ----------
  function moveDeal(d, stage, cardEl) {
    if (!d || d.stage === stage) return;
    d.stage = stage; // instant feel; the saved copy follows
    store.update("deals", d.id, { stage, moved: new Date().toISOString() });
    render();
    if (stage === "signed") smallParty(cardEl, "SIGNED! Way to go Kristen!");
  }
  function toggleDone(t, done, srcEl) {
    if (done) {
      const tk = todayKey();
      const picks = S.tasks.filter((x) => x.focus === tk);
      const finishesDay = t.focus === tk && picks.length > 0 && picks.every((x) => x.id === t.id || x.done);
      finishesDay ? megaParty() : smallParty(srcEl);
    }
    t.done = done;
    store.update("tasks", t.id, done ? { done: true, doneAt: new Date().toISOString() } : { done: false, doneAt: null });
    render();
  }
  function toggleFocus(t) {
    const tk = todayKey(); const on = t.focus !== tk;
    t.focus = on ? tk : null; store.update("tasks", t.id, { focus: t.focus }); render();
  }
  function armOrDo(key, btn, action) {
    if (S.armDelete === key) { S.armDelete = null; action(); return; }
    S.armDelete = key; render();
    clearTimeout(armOrDo.t); armOrDo.t = setTimeout(() => { if (S.armDelete === key) { S.armDelete = null; render(); } }, 3500);
  }
  function delButton(key, label, action) {
    const armed = S.armDelete === key;
    const b = el("button", "icon-btn danger" + (armed ? " confirm" : ""), armed ? "Sure?" : "🗑");
    b.type = "button"; b.title = label; b.setAttribute("aria-label", armed ? "Click again to " + label.toLowerCase() : label);
    b.addEventListener("click", (e) => { e.stopPropagation(); armOrDo(key, b, action); });
    return b;
  }

  // ---------- Drag (mouse anywhere on card, touch via the grip) ----------
  function colAt(x, y) { const e = document.elementFromPoint(x, y); return e ? e.closest(".col") : null; }
  function enableDrag(card, d) {
    card.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 || e.target.closest("button:not(.grip)")) return;
      if (e.pointerType !== "mouse" && !e.target.closest(".grip")) return;
      const sx = e.clientX, sy = e.clientY, rect = card.getBoundingClientRect();
      let ghost = null, over = null;
      const move = (ev) => {
        if (!ghost) {
          if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
          ghost = card.cloneNode(true); ghost.classList.add("ghost"); ghost.style.width = rect.width + "px";
          document.body.appendChild(ghost); card.classList.add("dragging");
        }
        ev.preventDefault();
        ghost.style.transform = "translate(" + (ev.clientX - (sx - rect.left)) + "px," + (ev.clientY - (sy - rect.top)) + "px) rotate(-3deg)";
        const c = colAt(ev.clientX, ev.clientY);
        if (c !== over) { if (over) over.classList.remove("over"); over = c; if (over) over.classList.add("over"); }
      };
      const up = (ev) => {
        removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
        if (!ghost) return;
        ghost.remove(); card.classList.remove("dragging"); if (over) over.classList.remove("over");
        const c = ev.type === "pointerup" ? colAt(ev.clientX, ev.clientY) : null;
        if (c) moveDeal(d, c.dataset.stage, c);
      };
      addEventListener("pointermove", move, { passive: false }); addEventListener("pointerup", up); addEventListener("pointercancel", up);
    });
  }

  // ---------- Rendering ----------
  function renderMoney() {
    const box = $("money"); box.replaceChildren();
    let total = 0;
    for (const st of STAGES) {
      const ds = S.deals.filter((d) => d.stage === st.id);
      const sum = ds.reduce((a, d) => a + (Number(d.amount) || 0), 0); total += sum;
      const t = el("div", "tile"); t.style.background = st.color;
      t.append(el("span", "kicker", st.name.toUpperCase()), el("span", "amt", money(sum)), el("span", "cnt", ds.length + (ds.length === 1 ? " deal" : " deals")));
      box.append(t);
    }
    const tot = el("div", "tile total"); tot.append(el("span", "kicker", "TOTAL"), el("span", "amt", money(total)), el("span", "cnt", S.deals.length + " deals on the board"));
    const cut = el("div", "tile cut"); cut.append(el("span", "kicker", "10% OF REVENUE"), el("span", "amt", money(total * 0.1)), el("span", "cnt", "10% of the total"));
    box.append(tot, cut);
  }

  function renderPipeline() {
    const p = $("pipeline"); p.replaceChildren();
    STAGES.forEach((st, si) => {
      const col = el("div", "col"); col.dataset.stage = st.id; col.style.backgroundColor = st.color;
      const ds = S.deals.filter((d) => d.stage === st.id).sort(byCreated);
      const head = el("div", "col-head"); head.append(el("h3", null, st.name), el("span", "sum", String(ds.length)));
      const cards = el("div", "col-cards");
      if (!S.loaded.deals) cards.append(el("div", "empty", "Loading…"));
      else if (!ds.length) cards.append(el("div", "empty", si === 0 ? "No consults yet. Add one above." : "Drop a card here."));
      for (const d of ds) {
        const c = el("article", "deal");
        if (d.example) c.append(el("span", "sample-tag", "EXAMPLE"));
        c.append(el("div", "name", d.name || "Unnamed"), el("div", "val", money(d.amount)));
        if (d.notes) c.append(el("div", "notes", d.notes));
        const row = el("div", "row"); const left = el("div", "grp"), right = el("div", "grp");
        const grip = el("button", "icon-btn grip", "⠿"); grip.type = "button"; grip.title = "Drag to move"; grip.setAttribute("aria-label", "Drag to move");
        left.append(grip);
        const edit = el("button", "icon-btn", "✎"); edit.type = "button"; edit.title = "Edit deal"; edit.setAttribute("aria-label", "Edit deal");
        edit.addEventListener("click", () => openEdit(d));
        right.append(edit, delButton("deal:" + d.id, "Delete deal", () => store.remove("deals", d.id)));
        row.append(left, right); c.append(row);
        enableDrag(c, d); cards.append(c);
      }
      col.append(head, cards); p.append(col);
    });
  }

  function listName(t) {
    if (t.list === "events") { const ev = S.events.find((e) => e.id === t.eventId); return ev ? "EVENT · " + ev.name : "EVENT PLANNING"; }
    const l = LISTS.find((x) => x.id === t.list); return l ? l.name : "";
  }

  function taskRow(t, opts) {
    const row = el("div", "task" + (t.done ? " done" : ""));
    const box = el("input", "tick"); box.type = "checkbox"; box.checked = !!t.done; box.setAttribute("aria-label", (t.done ? "Mark not done: " : "Mark done: ") + t.text);
    box.addEventListener("change", () => toggleDone(t, box.checked, box));
    const txt = el("div", "txt", t.text);
    if (t.example) txt.prepend(el("span", "sample-tag", "EXAMPLE"), document.createTextNode(" "));
    if (opts && opts.where) txt.append(el("span", "where", listName(t).toUpperCase()));
    row.append(box, txt);
    if (!t.done) {
      const on = t.focus === todayKey();
      const star = el("button", "icon-btn" + (on ? " on" : ""), on ? "★" : "☆"); star.type = "button";
      star.title = on ? "Remove from today's mission critical tasks" : "Make mission critical today"; star.setAttribute("aria-label", star.title);
      star.addEventListener("click", () => toggleFocus(t)); row.append(star);
    }
    if (!(opts && opts.noDelete)) row.append(delButton("task:" + t.id, "Delete task", () => store.remove("tasks", t.id)));
    return row;
  }

  function renderFocus() {
    const tk = todayKey();
    $("focusDate").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" }).toUpperCase();
    const picks = S.tasks.filter((t) => t.focus === tk).sort((a, b) => (a.done === b.done ? byCreated(a, b) : a.done ? 1 : -1));
    const done = picks.filter((t) => t.done).length;
    $("meterFill").style.width = picks.length ? (done / picks.length) * 100 + "%" : "0";
    $("meterLabel").textContent = done + " / " + picks.length;
    const box = $("focusList"); box.replaceChildren();
    if (!S.loaded.tasks) box.append(el("div", "empty", "Loading…"));
    else if (!picks.length) box.append(el("div", "empty", "Nothing picked yet. Tap the ☆ on any task to make it mission critical today."));
    for (const t of picks) box.append(taskRow(t, { where: true, noDelete: true }));
  }

  function renderLists() {
    const box = $("lists");
    const prevInp = $("newEvent"), prevVal = prevInp ? prevInp.value : "", hadFocus = prevInp && document.activeElement === prevInp;
    setTimeout(() => { const n = $("newEvent"); if (n && prevVal && !n.value) n.value = prevVal; if (n && hadFocus) n.focus(); }, 0);
    box.replaceChildren();
    for (const l of LISTS) {
      const panel = el("section", "panel list-panel");
      const open = S.tasks.filter((t) => t.list === l.id && !t.done).sort(byCreated);
      const head = el("div", "lp-head"); head.style.background = l.color;
      head.append(el("h2", null, l.name), el("span", "count-pill", String(open.length)));
      const body = el("div", "lp-body");
      if (!S.loaded.tasks) body.append(el("div", "empty", "Loading…"));
      else if (l.id !== "events") {
        if (!open.length) body.append(el("div", "empty", "All clear here."));
        for (const t of open) body.append(taskRow(t));
      } else {
        const add = el("form", "event-add"); add.autocomplete = "off";
        const inp = el("input", "field"); inp.id = "newEvent"; inp.placeholder = "New event name…"; inp.maxLength = 80; inp.setAttribute("aria-label", "New event name");
        const b = el("button", "btn small alt", "+ Event"); b.type = "submit";
        add.append(inp, b);
        add.addEventListener("submit", (e) => {
          e.preventDefault(); const name = inp.value.trim(); if (!name) return;
          inp.value = ""; store.add("events", { name, created: new Date().toISOString() });
        });
        body.append(add);
        const evs = S.events.slice().sort(byCreated);
        if (S.loaded.events && !evs.length) body.append(el("div", "empty", "No events yet. Name one above, then add tasks to it."));
        for (const ev of evs) {
          const blk = el("div", "event-block");
          const eh = el("div", "event-head"); eh.append(el("h3", null, ev.name));
          const tasks = open.filter((t) => t.eventId === ev.id);
          eh.append(delButton("event:" + ev.id, "Remove event and its tasks", () => {
            store.remove("events", ev.id);
            S.tasks.filter((t) => t.eventId === ev.id).forEach((t) => store.remove("tasks", t.id));
          }));
          blk.append(eh);
          if (!tasks.length) blk.append(el("div", "empty", "No tasks for this event yet."));
          for (const t of tasks) blk.append(taskRow(t));
          body.append(blk);
        }
        const loose = open.filter((t) => !S.events.some((e) => e.id === t.eventId));
        for (const t of loose) body.append(taskRow(t));
      }
      panel.append(head, body); box.append(panel);
    }
  }

  function renderDone() {
    const box = $("doneList"); box.replaceChildren();
    const done = S.tasks.filter((t) => t.done).sort((a, b) => String(b.doneAt || "").localeCompare(String(a.doneAt || "")));
    $("clearDone").hidden = !done.length;
    const armed = S.armDelete === "clear"; $("clearDone").textContent = armed ? "Sure? Click again" : "Clear done list";
    if (!S.loaded.tasks) { box.append(el("div", "empty", "Loading…")); return; }
    if (!done.length) { box.append(el("div", "empty", "Finished tasks land here. Go get one!")); return; }
    for (const t of done.slice(0, 60)) {
      const r = taskRow(t, { where: true });
      if (t.doneAt) r.insertBefore(el("span", "done-when", new Date(t.doneAt).toLocaleDateString(undefined, { month: "short", day: "numeric" })), r.lastChild);
      box.append(r);
    }
  }

  function renderSelects() {
    const sel = $("taskList"), keep = sel.value; sel.replaceChildren();
    for (const l of LISTS.filter((x) => x.id !== "events")) { const o = el("option", null, l.name); o.value = l.id; sel.append(o); }
    const og = el("optgroup"); og.label = "Upcoming Event Planning";
    const evs = S.events.slice().sort(byCreated);
    if (!evs.length) { const o = el("option", null, "Add an event first (in the Event Planning box)"); o.disabled = true; og.append(o); }
    for (const ev of evs) { const o = el("option", null, "Event: " + ev.name); o.value = "ev:" + ev.id; og.append(o); }
    sel.append(og);
    if ([...sel.options].some((o) => o.value === keep && !o.disabled)) sel.value = keep;
  }

  function render() {
    renderMoney(); renderPipeline(); renderSelects(); renderFocus(); renderLists(); renderDone();
  }

  // ---------- Edit deal ----------
  let editing = null;
  function openEdit(d) {
    editing = d; $("editName").value = d.name || ""; $("editAmt").value = d.amount ? String(d.amount) : ""; $("editStage").value = d.stage; $("editNotes").value = d.notes || "";
    $("modalBg").hidden = false; $("editName").focus();
  }
  const closeEdit = () => { $("modalBg").hidden = true; editing = null; };
  $("editCancel").addEventListener("click", closeEdit);
  $("modalBg").addEventListener("click", (e) => { if (e.target === $("modalBg")) closeEdit(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("modalBg").hidden) closeEdit(); });
  $("editForm").addEventListener("submit", (e) => {
    e.preventDefault(); if (!editing) return;
    const d = editing, stage = $("editStage").value, was = d.stage;
    const patch = { name: $("editName").value.trim() || "Unnamed", amount: parseAmt($("editAmt").value), stage, notes: $("editNotes").value.trim(), example: false };
    Object.assign(d, patch); store.update("deals", d.id, patch); closeEdit(); render();
    if (stage === "signed" && was !== "signed") smallParty(null, "SIGNED! Way to go Kristen!");
  });

  // ---------- Forms ----------
  for (const id of ["dealStage", "editStage"]) for (const st of STAGES) { const o = el("option", null, st.name); o.value = st.id; $(id).append(o); }
  $("dealForm").addEventListener("submit", (e) => {
    e.preventDefault(); const name = $("dealName").value.trim(); if (!name) return;
    store.add("deals", { name, amount: parseAmt($("dealAmt").value), stage: $("dealStage").value, notes: $("dealNotes").value.trim(), created: new Date().toISOString() });
    $("dealName").value = ""; $("dealAmt").value = ""; $("dealNotes").value = ""; $("dealStage").value = "consult"; $("dealName").focus();
  });
  $("taskForm").addEventListener("submit", (e) => {
    e.preventDefault(); const text = $("taskText").value.trim(); const where = $("taskList").value; if (!text || !where) return;
    const data = { text, done: false, created: new Date().toISOString(), focus: $("taskFocus").checked ? todayKey() : null };
    if (where.startsWith("ev:")) { data.list = "events"; data.eventId = where.slice(3); } else data.list = where;
    store.add("tasks", data); $("taskText").value = ""; $("taskFocus").checked = false; $("taskText").focus();
  });
  $("clearDone").addEventListener("click", () => armOrDo("clear", null, () => S.tasks.filter((t) => t.done).forEach((t) => store.remove("tasks", t.id))));

  // ---------- Clock & day rollover ----------
  let lastDay = todayKey();
  function tick() {
    const d = new Date();
    $("clock").textContent = d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }).toUpperCase() + "  " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    if (todayKey() !== lastDay) { lastDay = todayKey(); render(); }
    setTimeout(tick, 20000);
  }

  // ---------- Start ----------
  memphis(); tick(); render();
  const status = $("status");
  const offline = (why) => {
    S.db = null; loadLocal(); for (const k in S.loaded) S.loaded[k] = true;
    if (localOK) { status.textContent = "Saves automatically on this device ✿"; status.className = "status"; }
    else { status.textContent = why; status.className = "status warn"; }
    render();
  };
  const loadTimer = setTimeout(() => { if (!S.db || !Object.values(S.loaded).every(Boolean)) { status.textContent = "Can't reach your saved board yet. It'll fill in when the connection comes back."; status.className = "status warn"; } }, 10000);

  (window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null)).then((db) => {
    if (!db) { clearTimeout(loadTimer); offline("Saving is off in this browser, so changes will be lost when you close the page."); return; }
    S.db = db;
    for (const col of ["deals", "tasks", "events"]) {
      db.collection(col).onSnapshot((snap) => {
        S[col] = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
        S.loaded[col] = true;
        if (!snap.metadata.fromCache && Object.values(S.loaded).every(Boolean)) { clearTimeout(loadTimer); status.textContent = "All changes save automatically ✿"; status.className = "status"; }
        render();
      }, () => { S.loaded[col] = true; status.textContent = "Couldn't load part of your board. Reload the page to try again."; status.className = "status warn"; render(); });
    }
  }).catch(() => { clearTimeout(loadTimer); offline("Saving is off here: your changes won't be kept."); });
})();
</script>
